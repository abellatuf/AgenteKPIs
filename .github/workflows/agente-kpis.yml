# Corrida del Agente KPIs desde GitHub Actions.
# - Manual (Run workflow): eligís producto y si publica o solo genera el reporte.
# - Programada: pausada por razones prácticas (ver "on:" abajo). Para reactivarla, descomentá el schedule:
#   corre días hábiles 08:00 y 15:00 (Argentina), todos los productos de config/productos/, publicando en Jira y Notion.
#
# Secrets requeridos: GEMINI_API_KEY, OPENROUTER_API_KEY o ANTHROPIC_API_KEY, NOTION_TOKEN, JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN
# Opcional (secret o variable): AGENTE_PROVEEDOR (gemini | anthropic). JIRA_BASE_URL también puede ser variable.
#
# El reporte (salida/) no se sube como artefacto: en un repo público lo podría descargar
# cualquier usuario de GitHub, y se arma con el feedback real de Notion.

name: Agente KPIs

on:
  # Corrida programada pausada por razones prácticas: por ahora solo se corre a mano.
  # schedule:
  #   - cron: "0 11 * * 1-5" # 08:00 en Argentina (UTC-3)
  #   - cron: "0 18 * * 1-5" # 15:00 en Argentina (UTC-3)
  workflow_dispatch:
    inputs:
      producto:
        description: "Producto (archivo en config/productos/, sin .json). Vacío = todos"
        required: false
        default: ""
      publicar:
        description: "Crear tickets en Jira y completar Notion"
        type: boolean
        default: false

# Nunca dos corridas a la vez: evitaría tickets duplicados.
concurrency:
  group: agente-kpis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENTE_PROVEEDOR: ${{ vars.AGENTE_PROVEEDOR || secrets.AGENTE_PROVEEDOR }}
      AGENTE_MEJORAS: ${{ vars.AGENTE_MEJORAS || secrets.AGENTE_MEJORAS }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || secrets.JIRA_BASE_URL }}
      # En la corrida programada (hoy pausada) siempre se publica; en la manual, según el input.
      PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar }}
      PRODUCTO: ${{ inputs.producto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correr agente
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PRODUCTO}" ]; then
            productos="${PRODUCTO}"
          else
            productos=$(ls config/productos/*.json | xargs -n1 basename | sed 's/\.json$//')
          fi
          flag=""
          if [ "${PUBLICAR}" = "true" ]; then flag="--publicar"; fi
          for p in $productos; do
            echo "::group::${p}"
            npm start -- --producto "$p" $flag
            echo "::endgroup::"
          done
